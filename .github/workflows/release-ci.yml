name: Release CI

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    validation:
        uses: ./.github/workflows/test-ci.yml

    release:
        needs: validation
        runs-on: ubuntu-latest
        permissions:
            contents: write
            # Cache save (actions/cache and the buildkit type=gha backend)
            # needs it; explicit permissions zero it otherwise.
            actions: write
        env:
            # Persisted Docker layer cache (see docker-build.sh build()).
            # Same scope as test-ci.yml so both share one cache.
            ODM_CACHE_FROM: type=gha,scope=odm-dev-image
            ODM_CACHE_TO: type=gha,mode=max,scope=odm-dev-image
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # The host Maven repository is mounted into the packaging image
            # (see docker-build.sh); without a cache every tag redownloads it.
            - name: Cache Maven repository
              uses: actions/cache@v4
              with:
                  path: ~/.m2/repository
                  key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
                  restore-keys: |
                      ${{ runner.os }}-m2-

            - name: Extract version from tag
              id: version
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  case "$REF_NAME" in
                    v[0-9]*.[0-9]*) version="${REF_NAME#v}" ;;
                    *) echo "Invalid release tag" >&2; exit 2 ;;
                  esac
                  if ! [[ "$version" =~ ^[0-9]+([.][0-9]+){1,3}$ ]]; then
                    echo "Invalid release version" >&2
                    exit 2
                  fi
                  printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

            - name: Build Docker image
              run: ./docker-build.sh build

            - name: Build packages (.deb/.rpm/.pkg.tar.zst/AppImage)
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: ./docker-build.sh package "$VERSION"

            - name: Verify every package and bundled runtime
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: ./docker-build.sh verify "$VERSION"

            - name: Install test (.deb on clean Ubuntu)
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: docker run --rm -e VERSION -v "$(pwd)/packaging/dist:/pkgs:ro" ubuntu:24.04 bash -c 'apt-get update -qq && apt-get install -y -qq "/pkgs/open-download-manager_${VERSION}_amd64.deb" && test -x /usr/bin/open-download-manager'

            - name: AppImage without host GTK4, Java or download tools
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  for distro in 22.04 24.04; do
                      docker build --build-arg DISTRO="$distro" -t "odm-appimage-smoke:$distro" - < packaging/appimage/smoke.Dockerfile
                      docker run --init --rm --network=none -v "$(pwd):/app:ro" "odm-appimage-smoke:$distro" \
                          bash /app/packaging/verify-appimage.sh "/app/packaging/dist/Open_Download_Manager-${VERSION}-x86_64.AppImage"
                  done

            - name: Create release and attach packages
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  body: |
                      Packages for ${{ github.ref_name }}:

                      - `open-download-manager_${{ steps.version.outputs.version }}_amd64.deb` — Debian/Ubuntu
                      - `open-download-manager-${{ steps.version.outputs.version }}-1.x86_64.rpm` — Fedora/RHEL
                      - `open-download-manager-${{ steps.version.outputs.version }}-1-x86_64.pkg.tar.zst` — Arch Linux
                      - `Open_Download_Manager-${{ steps.version.outputs.version }}-x86_64.AppImage` — portable Linux x86_64 package for glibc 2.35+ (Ubuntu 22.04+)

                      The AppImage bundles Java 25, GTK4, aria2, curl, yt-dlp,
                      HTTrack, FFmpeg, proxychains and Tor. Browser discovery,
                      Subliminal subtitles and malware scanning use optional
                      host tools. Make the AppImage executable before launching.
                  fail_on_unmatched_files: true
                  files: |
                      packaging/dist/open-download-manager_${{ steps.version.outputs.version }}_amd64.deb
                      packaging/dist/open-download-manager-${{ steps.version.outputs.version }}-1.x86_64.rpm
                      packaging/dist/open-download-manager-${{ steps.version.outputs.version }}-1-x86_64.pkg.tar.zst
                      packaging/dist/Open_Download_Manager-${{ steps.version.outputs.version }}-x86_64.AppImage
                      packaging/dist/Open_Download_Manager-${{ steps.version.outputs.version }}-x86_64.AppImage.zsync
